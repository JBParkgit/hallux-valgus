# 환자 리포트 사이트 — 정적 파일 (Next.js export 결과 → /opt/hv-server/report-site)
#   https://<도메인>/report/{hash}  : 알림톡 '수술 안내서 보기' 버튼이 여는 주소
# 페이지는 같은 도메인의 /api/hv/report/{hash} 를 읽어 그린다.
# nginx-hv.conf 의 server 블록에서 include 한다 (/etc/nginx/snippets/hv-report.conf).

location ^~ /_next/ {
    root /opt/hv-server/report-site;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location ^~ /report/ {
    root /opt/hv-server/report-site;
    # /report/{hash} 는 모두 같은 페이지 — 해시는 페이지(브라우저)가 주소에서 읽는다
    try_files /report/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 환자용 '측정 각도 안내' 문서 (리포트에서 링크)
location ^~ /guide/ {
    root /opt/hv-server/report-site;
    try_files $uri $uri/index.html /guide/index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /favicon.ico {
    root /opt/hv-server/report-site;
}
