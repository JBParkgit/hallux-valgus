# nginx site for the hallux valgus API. __DOMAIN__ is replaced by setup.sh;
# certbot then adds the https (443) block and the http→https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # X-ray uploads (keep in sync with MAX_XRAY_MB in .env)
    client_max_body_size 30M;

    # 환자 리포트 사이트 (/report/{hash}) — deploy/nginx-hv-report.conf
    include snippets/hv-report.conf;

    location /api/hv/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
